name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, claude/**]
  workflow_dispatch:   # allow manual trigger from the Actions tab

# Grant the GITHUB_TOKEN the rights needed to deploy Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel a running deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── Job 1: assemble the site ──────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Scrabble word list (if not committed)
        run: |
          if [ ! -f words.txt ]; then
            echo "Downloading word list..."
            curl -fsSL "https://raw.githubusercontent.com/redbo/scrabbletools/master/dictionary.txt" \
              -o /tmp/raw_words.txt \
            && grep -E '^[A-Z]{2,15}$' /tmp/raw_words.txt \
              | sort -u > words.txt \
            || echo "Download failed — app will use CDN fallback at runtime"
          fi
          echo "Word list: $(wc -l < words.txt 2>/dev/null || echo 0) words"

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Deploy the repo root (index.html, styles.css, app.js, words.txt)
          path: '.'

  # ── Job 2: publish the artifact ───────────────────────────────────────────
  deploy:
    needs: build          # wait for the build job to upload the artifact
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
